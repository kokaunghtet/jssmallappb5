<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recap</title>
  <!-- Font awesome cdnjs link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <style type="text/css">
    * {
      box-sizing: border-box;

      font-family: sans-serif;
    }

    body {
      height: 90vh;
    }

    ul,
    ol {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    a {
      text-decoration: none;
      color: #000;
    }

    .container {
      width: 100%;
      height: 100%;

      display: grid;
      place-items: center;
    }

    .carousel {
      width: 500px;
      position: relative;
    }

    .carousel-indicator {
      display: flex;
      justify-content: center;

      width: 100%;

      position: absolute;
      left: 0;
      bottom: 30px;
    }

    .carousel-indicator .dots {
      display: inline-block;

      width: 10px;
      height: 10px;
      margin: 5px 10px;

      background-color: #bbb;
      border-radius: 50%;
    }

    .carousel-indicator .dots:hover,
    .carousel-indicator .dots.active {
      background-color: #888;
    }

    .carousel-inner {
      width: 100%;
      height: 100%;
      background-color: #f4f4f4;
      text-align: center;
    }

    .carousel-item {
      display: none;
      padding: 100px;
    }

    .carousel-item.active {
      display: block;
    }

    .carousel-item h4 {
      letter-spacing: 1px;
    }

    .carousel-item .user {
      width: 100px;
      height: 100px;
      border-radius: 50%;
    }

    .carousel-item .btn {
      width: 100px;
      padding: 5px 10px;

      background-color: steelblue;
      color: #fff;

      border-radius: 15px;

      text-decoration: none;
    }

    .carousel-control-prev,
    .carousel-control-next {
      padding: 10px;

      color: #bbb;
      font-size: 2rem;

      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .carousel-control-prev {
      left: 0;
    }

    .carousel-control-next {
      right: 0;
    }

    .carousel-control-prev:hover,
    .carousel-control-next:hover {
      color: #888;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="carousel">

      <ul class="carousel-indicator">
        <li class="dots active" data-bs-slide-to="0"></li>
        <li class="dots" data-bs-slide-to="1"></li>
        <li class="dots" data-bs-slide-to="2"></li>
      </ul>

      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="./user/user1.jpg" alt="user1" class="user">
          <h4>Project Director</h4>
          <a href="javascript:void(0)" class="btn"><i class="fas fa-envelope"></i> Contact me</a>
        </div>

        <div class="carousel-item">
          <img src="./user/user2.jpg" alt="user2" class="user">
          <h4>Senior Developer</h4>
          <a href="javascript:void(0)" class="btn"><i class="fas fa-envelope"></i> Contact Me</a>
        </div>

        <div class="carousel-item">
          <img src="./user/user3.jpg" alt="user3" class="user">
          <h4>Junior Web Developer</h4>
          <a href="javascript:void(0)" class="btn"><i class="fas fa-envelope"></i> Contact Me</a>
        </div>
      </div>

      <a href="javascript:void(0)" id="prev" class="carousel-control-prev"><i class="fas fa-angle-left"></i></a>

      <a href="javascript:void(0)" id="next" class="carousel-control-next"><i class="fas fa-angle-right"></i></a>
    </div>
  </div>

  <script type="text/javascript">
    let slides = document.getElementsByClassName("carousel-item");
    let dots = document.querySelectorAll(".dots");
    let currslide = 0;

    document.getElementById("prev").addEventListener("click", function () {
      carousel(currslide -= 1)
    });

    document.getElementById("next").addEventListener("click", function () {
      carousel(currslide += 1)
    });

    function carousel(num) {
      // remove active class
      for (i = 0; i < slides.length; i++) {
        slides[i].classList.remove("active");
        dots[i].classList.remove("active");
      }

      // condition for not to exceed the slides.length
      if (num > (slides.length - 1)) {
        currslide = 0;
      } else if (num < 0) {
        currslide = (slides.length - 1);
      }
      console.log(currslide, typeof (currslide));

      // add active class
      slides[currslide].classList.add("active");
      dots[currslide].classList.add("active");
    }

    for (j = 0; j < dots.length; j++) {
      dots[j].addEventListener("click", function () {
        currslide = parseInt(this.getAttribute("data-bs-slide-to"));
        carousel(currslide);
      });
    }

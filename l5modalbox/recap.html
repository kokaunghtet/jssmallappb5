<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal Recap</title>
  <!-- Font awesome cdnjs link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <style type="text/css">
    * {
      font-family: sans-serif;

      box-sizing: border-box;

      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;

      display: grid;
      place-items: center;
    }

    .container {
      width: 80%;

      padding: 20px;

      background-color: #f4f4f4;
      text-align: center;
    }

    .container h2 {
      margin-bottom: 20px;
    }

    .container button {
      padding: 6px 12px;

      background-color: steelblue;
      color: #fff;

      border: none;
      outline: none;
    }

    .clsfullscreen-btn {
      display: none;
    }

    .modal {
      display: none;

      width: 100%;
      height: 100%;

      background-color: #333;
      opacity: 0.9;

      position: absolute;
      left: 0;
      top: 0;
      z-index: 10;
    }

    .modal .btn-close {
      color: #fff;

      font-size: 40px;

      cursor: pointer;

      position: absolute;
      right: 20px;
      top: 20px;
    }

    .modal .btn-close:hover,
    .modal .btn-close:focus {
      color: rgb(200, 0, 0);
    }

    form {
      width: 500px;

      margin: 0 auto;
      padding: 20px;
    }

    form h2 {
      margin-bottom: 15px;

      color: #fff;
    }

    .input-group {
      display: flex;
      width: 100%;

      margin-bottom: 10px;
    }

    .icon {
      padding: 10px;

      background-color: steelblue;
      color: #fff;
    }

    .input-group-text {
      width: 100%;
      padding: 5px;

      border: 1px solid steelblue;
      outline: none;
    }

    .d-grid {
      width: 100%;
    }

    .btn {
      width: 100%;

      padding: 10px;

      background-color: steelblue;
      color: #fff;

      border: none;

      opacity: 0.9;
    }

    .btn:hover {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Modal Signup Form</h2>

    <button type="button" id="signup-btn" class="signup-btn">Signup</button>
    <button type="button" id="fullscreen-btn" class="fullscreen-btn">Fullscreen</button>
    <button type="button" id="clsfullscreen-btn" class="clsfullscreen-btn">Close Fullscreen</button>
  </div>


  <div id="modal" class="modal">
    <span id="btn-close" class="btn-close">&times;</span>

    <form action="" method="">
      <h2>Register Form</h2>

      <div class="input-group">
        <span><i class="fas fa-user icon"></i></span>
        <input type="text" name="username" id="username" class="input-group-text" placeholder="Username"
          autocomplete="off">
      </div>

      <div class="input-group">
        <span><i class="fas fa-envelope icon"></i></span>
        <input type="email" name="email" id="email" class="input-group-text" placeholder="Email" autocomplete="off">
      </div>

      <div class="input-group">
        <span><i class="fas fa-key icon"></i></span>
        <input type="password" name="password" id="password" class="input-group-text" placeholder="Password"
          autocomplete="off">
      </div>

      <div class="d-grid">
        <button type="button" id="btn" class="btn">Submit</button>
      </div>
    </form>
  </div>




  <script type="text/javascript">
    let getSignupBtn = document.getElementById("signup-btn"),
      getFullscreenBtn = document.getElementById("fullscreen-btn"),
      getClsFullscreenBtn = document.getElementById("clsfullscreen-btn");

    let getModal = document.getElementById("modal"),
      getBtnClose = document.getElementById("btn-close");

    getSignupBtn.addEventListener("click", function () {
      getModal.style.display = "block";
    });

    getBtnClose.addEventListener("click", function () {
      getModal.style.display = "none";
    });

    window.onclick = function (e) {
      if (e.target === getModal) {
        getModal.style.display = "none";
      }
    }

    getFullscreenBtn.addEventListener("click", function () {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      }

      getClsFullscreenBtn.style.display = "inline";
    });

    getClsFullscreenBtn.addEventListener("click", function () {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }

      getClsFullscreenBtn.style.display = "none";
    });
  </script>
</body>

</html>

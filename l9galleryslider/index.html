<!doctype html>
<html>
  <head>
    <title>Gallery Slider</title>
    <!-- Font awesome cdnjs link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <!-- custom css -->
    <link rel="stylesheet" type="text/css" href="./style.css" />
  </head>

  <body>
    <div class="container">
      <h3>Photo Gallery</h3>

      <div class="row">
        <img
          src="./img/image1.jpg"
          alt="image1"
          class="img"
          onclick="showNow(event)"
        />
        <img
          src="./img/image2.jpg"
          alt="image2"
          class="img"
          onclick="showNow(event)"
        />
        <img
          src="./img/image3.jpg"
          alt="image3"
          class="img"
          onclick="showNow(event)"
        />
        <img
          src="./img/image4.jpg"
          alt="image4"
          class="img"
          onclick="showNow(event)"
        />
        <img
          src="./img/image5.jpg"
          alt="image5"
          class="img"
          onclick="showNow(event)"
        />
        <img
          src="./img/image6.jpg"
          alt="image6"
          class="img"
          onclick="showNow(event)"
        />
        <img
          src="./img/image7.jpg"
          alt="image7"
          class="img"
          onclick="showNow(event)"
        />
        <img
          src="./img/image8.jpg"
          alt="image8"
          class="img"
          onclick="showNow(event)"
        />
        <img
          src="./img/image9.jpg"
          alt="image9"
          class="img"
          onclick="showNow(event)"
        />
      </div>
    </div>

    <!-- Modal Area -->
    <div class="modal">
      <span class="btn-close">&times;</span>

      <img src="" alt="" class="modal-img" />

      <p class="caption">Hello</p>
    </div>
    <!-- Modal Area -->

    <script type="text/javascript" src="./app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html>

<head>
  <title>Modal Box</title>
  <!-- Font awesome cdnjs link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <!-- custom css -->
  <link rel="stylesheet" type="text/css" href="./style.css">
</head>

<body>

  <div class="container">

    <h2>Login Form</h2>
    <button type="button" id="modal-btn" class="modal-btn">Modal btn</button>

    <div id="login-modal" class="modal fade">
      <div class="modal-dialog">

        <div class="modal-content">

          <div class="modal-header">
            <span id="btn-close" class="btn-close" title="close modal">&times;</span>
            <img src="./user/avatar.png" class="avatar" alt="avatar">
          </div>

          <div class="modal-body">
            <form action="" method="">

              <div class="form-group">
                <label class="username"><b>Username</b></label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Enter username"
                  required>
              </div>

              <div class="form-group">
                <label class="password"><b>Password</b></label>
                <input type="text" name="password" id="password" class="form-control" placeholder="Enter password"
                  required>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn">Login</button>
              </div>

              <label>
                <input type="checkbox" name="checked" id="checked"> Remember Me
              </label>

            </form>
          </div>

          <div class="modal-footer">
            <span class="forgot">Forgot <a href="javascript:void(0)">password ?</a></span>
          </div>

        </div>

      </div>
    </div>

  </div>




  <script type="text/javascript" src="./app.js"></script>
</body>

</html>

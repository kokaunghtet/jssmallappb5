<!DOCTYPE html>
<html>

<head>
  <title>Number Guess with Voice Command</title>

  <!-- font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="./style.css" type="text/css" />

</head>

<body>

  <div class="container">

    <h1>Number Guess with Voice Command</h1>
    <p>Guess a number between <span class="minNumber">00</span> to <span class="maxNumber">00</span>.</p>

    <form id="game" class="game" action="">

      <div class="form-group">

        <input type="number" name="guessnumber" id="guessNumber" class="form-control"
          placeholder="Enter your guess number" autofocus>

        <input type="submit" id="btn" class="btn" value="SUBMIT">

      </div>

      <span class="message1"></span>
      <span class="message2"></span>

    </form>

    <button type="button" id="mic-btn" class="mic-btn"><i class="fas fa-microphone"></i> Use Microphone</button>

    <div id="voice-container">
      <span></span>
    </div>

  </div>






  <script src="./app.js" type="text/javascript"></script>
</body>

</html>

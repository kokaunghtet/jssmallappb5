<!DOCTYPE html>
<html>

<head>
  <title>Text Editor</title>

  <!-- font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="./style.css" type="text/css" />

</head>

<body>

  <div class="container">
    <h4>Text Editor</h4>

    <div class="row">

      <div class="col-md-12">

        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Bold Text"
          data-command="bold">Bold</button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Italic Text"
          data-command="italic">Italic</button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Underline Text"
          data-command="underline">Underline</button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Line Through Text"
          data-command="strikeThrough">LineThrough</button>

        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Left Text"
          data-command="justifyLeft"><i class="fas fa-align-left"></i></button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Center Text"
          data-command="justifyCenter"><i class="fas fa-align-center"></i></button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Right Text"
          data-command="justifyRight"><i class="fas fa-align-right"></i></button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Full Text"
          data-command="justifyFull"><i class="fas fa-align-justify"></i></button>

        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Uppercase Text"
          onclick="upcasefun()">Upper
          case</button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Lowercase Text"
          onclick="lwcasefun()">Lower
          case</button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Capitalize Text"
          onclick="capcasefun()">Capitalize
          Case</button>

        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Subscript Text"
          data-command="subscript"><i class="fas fa-subscript"></i></button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Superscript Text"
          data-command="superscript"><i class="fas fa-superscript"></i></button>

        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Horizontal Ruler"
          data-command="insertHorizontalRule"><i class="fas fa-ruler"></i></button>

        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Order List"
          data-command="insertOrderedList"><i class="fas fa-list-ol"></i></button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Under List"
          data-command="insertUnorderedList"><i class="fas fa-list-ul"></i></button>

        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Select All Text"
          data-command="selectAll"><i class="fas fa-check"></i></button>

        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Backspace"
          data-command="delete"><i class="fas fa-backspace"></i></button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Forward Delete"
          data-command="forwardDelete"><i class="fas fa-trash-alt"></i></button>

        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Redo" data-command="redo"><i
            class="fas fa-redo"></i></button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Undo" data-command="undo"><i
            class="fas fa-undo"></i></button>

        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Link"
          data-command="createLink"><i class="fas fa-link"></i></button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Unlink" data-command="unlink"><i
            class="fas fa-unlink"></i></button>

        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Copy" data-command="copy"><i
            class="fas fa-copy"></i></button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Cut" data-command="cut"><i
            class="fas fa-cut"></i></button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Paste" data-command="paste"><i
            class="fas fa-paste"></i></button>

        <select name="txtcolor" id="txtcolor" class="btn btn-outline-secondary rounded-0" data-command="foreColor">
          <option value="black">Black</option>
          <option value="white">White</option>
          <option value="red">Red</option>
          <option value="green">Green</option>
          <option value="blue">Blue</option>
        </select>

        <select name="bgcolor" id="bgcolor" class="btn btn-outline-secondary rounded-0" data-command="backColor">
          <option value="black">Black</option>
          <option value="white">White</option>
          <option value="red">Red</option>
          <option value="green">Green</option>
          <option value="blue">Blue</option>
        </select>

        <select name="fntname" id="fntname" class="btn btn-outline-secondary rounded-0" data-command="fontName">
          <option value="arial">Arial</option>
          <option value="centruy">Centruy</option>
          <option value="sans-serif">Sans-Serif</option>
          <option value="time new roman">Time New Roman</option>
        </select>

        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Clear"
          data-command="clearText">Clear</button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Remove Format"
          data-command="removeFormat">Remove
          Format</button>

      </div>

    </div>

    <div class="row">

      <div class="col-md-12">
        <form action="" method="">
          <div class="form-group">
            <!-- <div id="divarea" class="divarea" contenteditable="true" spellcheck="false"></div> -->
            <div id="divarea" class="divarea"></div>
          </div>
          <div class="text-end">
            <button type="button" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
        </form>
      </div>

    </div>

  </div>




  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="./app.js" type="text/javascript"></script>
</body>

</html>

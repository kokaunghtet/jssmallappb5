<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List Recap</title>

  <!-- Font awesome cdnjs link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style type="text/css">
    * {
      font-family: sans-serif;
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;

      height: 100vh;

      margin: 0;
      padding: 0;
    }

    .container {
      border: 1px solid #ccc;
      border-radius: 10px;

      padding: 10px;
    }

    .container h3 {
      margin: 0;
      padding: 0;

      line-height: 60px;

      color: #777;
      opacity: 0.8;

      border-bottom: 1px dashed #777;
    }

    .container small {
      display: block;

      margin: 10px 0;

      color: #777;

      text-align: center;
    }

    #form {
      width: 400px;

      margin: 10px 0;
    }

    .form-control {
      width: 100%;

      padding: 10px;

      font-size: 15px;

      outline: 0;
      border: 0;
      border-bottom: 2px solid orange;

      transition: all .3s;
    }

    .form-control:focus {
      border: 0;
      outline: 0;
      border-bottom: 2px solid blue;
    }

    .form-control::placeholder {
      color: #d5d5d5;
    }

    .list-group {
      height: 300px;

      margin: 0;
      padding: 0;

      list-style: none;

      overflow-y: scroll;
    }

    .list-group li {
      margin-top: -1px;
      padding: 10px;

      background-color: #f6f6f6;

      border: 1px solid #ddd;

      font-size: 15px;

      transition: all .3s;

      cursor: pointer;
      user-select: none;
    }

    .list-group li:hover {
      background-color: #f1f1f1;
    }

    .list-group li.completed {
      color: #777;

      font-style: italic;
      text-decoration: line-through;
    }

    .list-group li.completed::after {
      content: "\f00c";
      font-family: FontAwesome;
      float: right;
    }
  </style>
</head>

<body>

  <div class="container">

    <h3>My Todo List</h3>
    <small>Left click to complete & right click to delete</small>

    <form id="form" action="" method="">
      <div class="form-group">
        <input type="text" name="textbox" id="textbox" class="form-control" placeholder="Write Something"
          autocomplete="off" />
      </div>
    </form>


    <ul class="list-group">
    </ul>

  </div>

  <script type="text/javascript">
    let getForm = document.getElementById("form");
    let getTextbox = document.getElementById("textbox");
    let getul = document.querySelector(".list-group");

    getForm.addEventListener("submit", function (e) {
      addNew();

      e.preventDefault();
    });

    let gettodos = JSON.parse(localStorage.getItem("todos"));
    if (gettodos) {
      gettodos.forEach(function (gettodo) {
        addNew(gettodo);
      });
    }

    function addNew(todo) {
      let todotext = getTextbox.value;

      if (todo) {
        todotext = todo.text;
      };

      if (todotext) {
        let newli = document.createElement("li");
        if (todo && todo.done) {
          newli.classList.add("completed");
        }
        newli.appendChild(document.createTextNode(todotext));
        getul.appendChild(newli);
        getTextbox.value = "";
        getTextbox.focus();

        updateLocalStorage();

        newli.addEventListener("click", function () {
          this.classList.toggle("completed");

          updateLocalStorage();
        });

        newli.addEventListener("contextmenu", function (e) {
          this.remove();

          updateLocalStorage();

          e.preventDefault();
        });
      }
    };

    function updateLocalStorage() {
      getlis = document.querySelectorAll("li");

      let todos = [];

      getlis.forEach(function (getli) {
        todos.push({
          text: getli.textContent,
          done: getli.classList.contains("completed"),
        });
      });

      localStorage.setItem("todos", JSON.stringify(todos));
    };




  </script>
</body>

</html>

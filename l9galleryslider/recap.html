<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recap</title>
  <style type="text/css">
    * {
      font-family: sans-serif;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .container {
      width: 1200px;

      padding: 20px;

      background-color: #f4f4f4;

      border: 1px solid #999;
      border-radius: 10px;
    }

    .container .row {
      display: flex;
      flex-wrap: wrap;
    }

    .row .img {
      width: 20%;

      transition: all .3s;
    }

    .row img:hover {
      opacity: 0.7;
    }

    .modal {
      display: none;

      width: 100%;
      height: 100%;

      background-color: rgba(0, 0, 0, 0.9);

      position: absolute;
      left: 0;
      top: 0;
    }

    .modal .modal-img {
      display: block;

      margin: auto;
      margin-top: 30px;
    }

    .modal .caption {
      width: 360px;

      margin: 10px auto;


      color: #aaa;
    }

    .btn-close {
      color: #aaa;

      font-size: 3rem;

      cursor: pointer;

      position: absolute;
      right: 30px;
      top: 10px;

      transition: all .3s;
    }

    .btn-close:hover {
      color: firebrick;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Gallery Slider</h2>

    <div class="row">
      <img src="./img/image1.jpg" alt="image1" class="img" />
      <img src="./img/image2.jpg" alt="image2" class="img" />
      <img src="./img/image3.jpg" alt="image3" class="img" />
      <img src="./img/image4.jpg" alt="image4" class="img" />
      <img src="./img/image5.jpg" alt="image5" class="img" />
      <img src="./img/image6.jpg" alt="image6" class="img" />
      <img src="./img/image7.jpg" alt="image7" class="img" />
      <img src="./img/image8.jpg" alt="image8" class="img" />
      <img src="./img/image9.jpg" alt="image9" class="img" />
    </div>
  </div>


  <div class="modal">
    <img class="modal-img">
    <p class="caption"></p>
    <span class="btn-close">&times;</span>
  </div>

  <script type="text/javascript">
    let getimg = document.getElementsByClassName("img");
    let getmodal = document.querySelector(".modal"),
      getmodalimg = document.querySelector(".modal-img"),
      getcaption = document.querySelector(".caption"),
      getbtnclose = document.querySelector(".btn-close");

    for (i = 0; i < getimg.length; i++) {
      getimg[i].addEventListener("click", function (e) {
        getmodal.style.display = "block";
        getmodalimg.src = e.target.src;
        getcaption.textContent = e.target.alt;
      });

      getbtnclose.addEventListener("click", function () {
        getmodal.style.display = "none";
      });

      document.addEventListener("click", function (e) {
        if (e.target === getmodal) {
          getmodal.style.display = "none";
        }
      });
    }
  </script>
</body>

</html>

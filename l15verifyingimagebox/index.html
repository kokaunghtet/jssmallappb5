<!doctype html>
<html>
  <head>
    <title>Image Verify Box</title>
    <!-- Font awesome cdnjs link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- custom css -->
    <link rel="stylesheet" type="text/css" href="./style.css" />
  </head>

  <body>
    <div class="container">
      <h3 class="question">Question Text goes in HERE.</h3>

      <div class="imgbox">
        <input type="radio" name="answer" id="a" class="answer" hidden />
        <label for="a">
          <img src="./img/airport.jpg" alt="a_img" id="a_img" />
        </label>

        <input type="radio" name="answer" id="b" class="answer" hidden />
        <label for="b">
          <img src="./img/airport.jpg" alt="b_img" id="b_img" />
        </label>

        <input type="radio" name="answer" id="c" class="answer" hidden />
        <label for="c">
          <img src="./img/airport.jpg" alt="c_img" id="c_img" />
        </label>

        <input type="radio" name="answer" id="d" class="answer" hidden />
        <label for="d">
          <img src="./img/airport.jpg" alt="d_img" id="d_img" />
        </label>
      </div>

      <button type="button" class="next-btn">Next</button>
    </div>

    <script type="text/javascript" src="./app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html>

<head>
  <title>Slider</title>

  <!-- Font awesome cdnjs link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

  <!-- custom css link -->
  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
  <div class="container">

    <div class="carousel">

      <div class="carousel-inner">

        <div class="carousel-item">
          <img src="./user/user1.jpg" alt="user1" class="user">
          <h3 class="job-title">Project Director</h3>
          <a href="#" class="contact-btn"><i class="fas fa-envelope"></i> Contact me</a>
        </div>

        <div class="carousel-item">
          <img src="./user/user2.jpg" alt="user2" class="user">
          <h3 class="job-title">Senior Developer</h3>
          <a href="#" class="contact-btn"><i class="fas fa-envelope"></i> Contact me</a>
        </div>

        <div class="carousel-item">
          <img src="./user/user3.jpg" alt="user3" class="user">
          <h3 class="job-title">Junior Web Designer</h3>
          <a href="#" class="contact-btn"><i class="fas fa-envelope"></i> Contact me</a>
        </div>

      </div>

      <ul class="carousel-indicators">
        <li class="dot" data-bs-slide-to="1"></li>
        <li class="dot" data-bs-slide-to="2"></li>
        <li class="dot" data-bs-slide-to="3"></li>
      </ul>

      <a href="#" id="prev" class="carousel-control-prev"><i class="fas fa-angle-left"></i></a>

      <a href="#" id="next" class="carousel-control-next"><i class="fas fa-angle-right"></i></a>

    </div>

  </div>

  <script type="text/javascript" src="app.js"></script>
</body>

</html>

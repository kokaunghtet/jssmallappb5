<!DOCTYPE html>
<html>

<head>
  <title>Email Box</title>
  <!-- Font awesome cdnjs link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- custom css -->
  <link rel="stylesheet" type="text/css" href="./style.css">
</head>

<body>

  <div class="container">
    <h3>This is Email Box. You can divide by a comma (",")</h3>


    <form action="" method="">
      <input type="email" name="email[]" id="emails" class="form-control" placeholder="Enter email address..." />
      <textarea name="msg" id="msg" class="form-control" placeholder="Enter Message"></textarea>
      <div class="justify-content-end">
        <button type="submit" class="btn">Send</button>
      </div>
    </form>

    <div class="email-container">
      <!-- <span class="email-item">Sample 1</span>
      <span class="email-item">Sample 2</span>
      <span class="email-item">Sample 3</span>
      <span class="email-item">Sample 4</span>
      <span class="email-item">Sample 5</span> -->
    </div>
  </div>




  <script type="text/javascript" src="./app.js"></script>
</body>

</html>

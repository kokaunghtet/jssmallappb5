<!doctype html>
<html>
  <head>
    <title>Audio Player</title>

    <!-- Fontawesome cdnjs -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Custom CSS -->
    <link href="./style.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <div class="container">
      <h1>Audio Player</h1>

      <audio
        src="./source/sample1.mp3"
        id="audioScreen"
        class="audio-screen"
      ></audio>

      <div class="controls">
        <button type="button" id="prev" class="ctrl-btn">
          <i class="fas fa-backward"></i>
        </button>

        <button type="button" id="play" class="ctrl-btn">
          <i class="fas fa-play"></i>
        </button>

        <button type="button" id="next" class="ctrl-btn">
          <i class="fas fa-forward"></i>
        </button>

        <button type="button" id="stop" class="ctrl-btn">
          <i class="fas fa-stop"></i>
        </button>

        <div id="progress" class="progress">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <input
          type="range"
          name="volumeprogress"
          id="volumeProgress"
          class="volume-progress"
          min="0"
          max="100"
          value="100"
        />

        <span id="displayTime" class="display-time">00:00</span>
      </div>
    </div>

    <!-- Custom JS -->
    <script src="./app.js" type="text/javascript"></script>
  </body>
</html>
